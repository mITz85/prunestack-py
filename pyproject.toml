[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "prunestack"
version = "2.2.0"
description = "Meta-feature guided performance-diversity pruning of heterogeneous ensembles with Elephant Herding Optimization and stacking"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Marko Domladovac", email = "marko@mitz-is.me"},
]
keywords = ["ensemble pruning", "stacking", "diversity", "meta-learning", "elephant herding optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "pyyaml>=6.0.3",
    "tqdm>=4.70",
    "joblib>=1.5",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.11"]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "matplotlib>=3.11",
]

[project.urls]
Homepage = "https://github.com/mITz85/prunestack-py"
Documentation = "https://github.com/mITz85/prunestack-py/tree/main/docs"
Repository = "https://github.com/mITz85/prunestack-py"
Changelog = "https://github.com/mITz85/prunestack-py/blob/main/CHANGELOG.md"

[project.scripts]
prunestack = "prunestack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prunestack = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
timeout = 300
